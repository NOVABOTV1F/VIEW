<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: "Manrope";
  src: url("file:///workspace/.grok/fonts/Manrope.ttf") format("truetype");
  font-weight: 200 800;
  font-style: normal;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: #FFFFFF;
}
body {
  font-family: Manrope, "Liberation Sans", sans-serif;
  color: #2E2A2C;
}
.stage {
  width: 1200px;
  height: 630px;
  background:
    radial-gradient(980px 520px at 50% 46%, #FFFFFF 0%, #F7E9EC 72%);
  display: flex;
  align-items: center;
  justify-content: center;
}
.cluster {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.window {
  width: 520px;
  height: 228px;
  background: #FFFFFF;
  border-radius: 28px;
  box-shadow: 0 18px 44px rgba(201, 127, 143, 0.22);
  position: relative;
  margin-bottom: 36px;
}
.chrome {
  height: 42px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 18px;
  border-bottom: 1.5px solid #F7E9EC;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #C97F8F;
}
.dot.mid { background: #B36A7A; }
.dot.soft { background: #F7E9EC; box-shadow: inset 0 0 0 1.5px #C97F8F; }
.rec {
  position: absolute;
  left: 50%;
  top: calc(50% + 16px);
  transform: translate(-50%, -50%);
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: #C97F8F;
  box-shadow: 0 10px 24px rgba(201, 127, 143, 0.38);
  display: flex;
  align-items: center;
  justify-content: center;
}
.rec i {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #FFFFFF;
  display: block;
}
h1 {
  font-size: 84px;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  color: #2E2A2C;
}
.sub {
  margin-top: 14px;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: #B36A7A;
}
</style>
</head>
<body>
  <div class="stage">
    <div class="cluster">
      <div class="window" aria-hidden="true">
        <div class="chrome">
          <span class="dot"></span>
          <span class="dot mid"></span>
          <span class="dot soft"></span>
        </div>
        <div class="rec"><i></i></div>
      </div>
      <h1>QWENXYXF</h1>
      <p class="sub">Screen Recorder</p>
    </div>
  </div>
</body>
</html>
